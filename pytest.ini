[pytest]
# Run only inside the container: ./tc.sh pytest  (in parallel: ./tc.sh pytest -n auto)
# Deselected by default: slow (runs that take minutes, such as non-UF reference
# runs) and validation (heavy proofs and larger parameter grids).
# Slow: ./tc.sh pytest -m slow -n auto
# Validation: ./tc.sh pytest -m validation -n auto
testpaths = tests smoke
python_files = test_*.py
addopts = -ra -p no:cacheprovider -m "not slow and not validation"
markers =
    slow: run takes minutes; not part of the default run, select with -m slow
    validation: heavy validation runs (non-UF datapath comparisons, larger configurations); not part of the default run, select with -m validation
xfail_strict = true
